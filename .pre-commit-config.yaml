repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-json
        files: ^index\.json$
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: validate-prompts
        name: Validate prompt frontmatter
        entry: node scripts/validate.js
        language: system
        pass_filenames: false
        always_run: true

      - id: generate-index
        name: Regenerate index.json
        entry: node scripts/generate-index.js
        language: system
        pass_filenames: false
        always_run: true
